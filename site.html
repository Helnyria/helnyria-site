<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessizliğin Sesleri | Melankolik Portfolyo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Special+Elite&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#000000',
                        rust: '#8b3a2b',
                        rustlight: '#b84a39',
                        fog: '#64748b'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        grunge: ['Special Elite', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            background-color: #000000;
            color: #d1d5db;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        .crt-overlay {
            background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 3px;
            pointer-events: none;
        }

        .vignette {
            box-shadow: inset 0 0 120px rgba(0,0,0,0.95);
            pointer-events: none;
        }

        @keyframes fogMove {
            0% { transform: translate3d(-5%, -3%, 0); opacity: 0.15; }
            50% { transform: translate3d(5%, 3%, 0); opacity: 0.28; }
            100% { transform: translate3d(-5%, -3%, 0); opacity: 0.15; }
        }

        .animated-fog {
            background: radial-gradient(circle, rgba(100, 116, 139, 0.08) 0%, rgba(0,0,0,0) 70%);
            animation: fogMove 25s infinite ease-in-out;
            pointer-events: none;
            will-change: transform;
        }

        .sh-card {
            background: rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease;
        }

        .sh-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .specs-accordion {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, margin 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .specs-accordion.open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 0.75rem;
            pointer-events: auto;
        }

        .specs-accordion-inner {
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #241310;
            border-radius: 3px;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(139, 58, 43, 0.3), inset 0 0 10px rgba(139, 58, 43, 0.2); }
            50% { box-shadow: 0 0 28px rgba(184, 74, 57, 0.6), inset 0 0 18px rgba(184, 74, 57, 0.4); }
        }

        .avatar-pulse {
            animation: pulseGlow 4s infinite ease-in-out;
        }

        @keyframes melancholicAppear {
            0% { opacity: 0; filter: blur(25px); transform: scale(1.03); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        .melancholic-appear {
            animation: melancholicAppear 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scaryEyePulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(184, 74, 57, 0.5)); opacity: 0.85; }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 22px rgba(255, 50, 50, 0.9)); opacity: 1; }
        }
        .scary-eye-portal {
            animation: scaryEyePulse 2.8s infinite ease-in-out;
            cursor: pointer;
        }

        #settingsDropdown {
            transform-origin: top right;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        #settingsDropdown.hidden-panel {
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes stormPanicBorder {
            0%, 100% { box-shadow: inset 0 0 25px rgba(234, 179, 8, 0.4); }
            50% { box-shadow: inset 0 0 65px rgba(234, 179, 8, 0.9); }
        }
        .storm-panic-border {
            animation: stormPanicBorder 0.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative min-h-screen font-sans selection:bg-rust selection:text-white pb-24 overflow-x-hidden">

    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- Interactive Portal Gate Overlay (Scary Eye Only) -->
    <div id="gunsEnterOverlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black text-stone-200 transition-all duration-700 select-none cursor-pointer">
        <div id="enterPortalBtn" class="scary-eye-portal flex items-center justify-center p-4">
            <i class="fa-solid fa-eye text-6xl sm:text-7xl text-red-700 hover:text-red-500 transition duration-300"></i>
        </div>
    </div>

    <!-- Ambient Canvas for Procedural Rain -->
    <canvas id="rainCanvas" class="fixed inset-0 z-0 pointer-events-none" style="width: 100vw; height: 100vh; position: fixed; top: 0; left: 0;"></canvas>

    <div class="fixed inset-0 z-0 animated-fog w-[150%] h-[150%] -top-[25%] -left-[25%] pointer-events-none"></div>
    <div class="fixed inset-0 z-10 vignette pointer-events-none"></div>
    <div id="lightningOverlay" class="fixed inset-0 pointer-events-none transition-all duration-75" style="z-index: 15;"></div>
    <div id="crtOverlay" class="fixed inset-0 z-20 crt-overlay transition-opacity duration-300 opacity-100 pointer-events-none"></div>

    <!-- Top Right Settings Trigger Button -->
    <div class="fixed top-4 right-4 z-[90]">
        <button id="btnToggleSettings" title="Ses ve Efekt Ayarları" class="w-10 h-10 rounded-xl bg-black/70 backdrop-blur-md border border-white/15 text-stone-300 hover:text-white hover:border-white/30 transition flex items-center justify-center cursor-pointer shadow-xl opacity-0 pointer-events-none duration-500">
            <i class="fa-solid fa-gear text-sm"></i>
        </button>

        <!-- Compact Floating Panel -->
        <div id="settingsDropdown" class="hidden-panel absolute right-0 mt-2 w-56 bg-black/90 backdrop-blur-xl border border-white/15 rounded-2xl p-3.5 shadow-2xl text-stone-200 flex flex-col gap-3">
            
            <!-- Play/Pause & Title Bar -->
            <div class="flex items-center justify-between pb-2.5 border-b border-white/10">
                <div class="flex items-center gap-2 min-w-0 pr-2">
                    <span id="musicStatus" class="inline-block w-2 h-2 rounded-full bg-stone-600 shrink-0"></span>
                    <span class="text-[11px] font-cinzel font-bold truncate text-stone-300">Not Tomorrow</span>
                </div>
                <button id="btnPlayPauseModal" class="w-7 h-7 rounded-lg bg-rust/40 hover:bg-rust border border-rustlight/30 flex items-center justify-center text-stone-200 transition cursor-pointer shrink-0">
                    <i id="playIconModal" class="fa-solid fa-play text-[10px]"></i>
                </button>
            </div>

            <!-- Rain Volume Slider with Percentage -->
            <div class="flex flex-col gap-1">
                <div class="flex items-center justify-between text-[11px] text-stone-400 font-mono">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-cloud-rain text-xs"></i> Yağmur Sesi</span>
                    <span id="rainValText">40%</span>
                </div>
                <input id="rainVolumeSlider" type="range" min="0" max="1" step="0.01" value="0.4" class="w-full accent-stone-400 cursor-pointer h-1.5 bg-stone-800 rounded-lg">
            </div>

            <!-- Music Volume Slider with Percentage -->
            <div class="flex flex-col gap-1">
                <div class="flex items-center justify-between text-[11px] text-stone-400 font-mono">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-music text-xs"></i> Müzik Sesi</span>
                    <span id="musicValText">60%</span>
                </div>
                <input id="musicVolumeSlider" type="range" min="0" max="1" step="0.01" value="0.6" class="w-full accent-stone-400 cursor-pointer h-1.5 bg-stone-800 rounded-lg">
            </div>

            <!-- Lightning Toggle Switch -->
            <div class="flex items-center justify-between pt-2 border-t border-white/10">
                <div class="flex items-center gap-2 text-xs text-stone-300">
                    <i class="fa-solid fa-bolt text-amber-400 w-4 text-center"></i>
                    <span class="text-[11px] font-mono">Şimşek</span>
                </div>
                <button id="btnToggleLightning" class="w-10 h-5 rounded-full bg-amber-500/20 border border-amber-500/40 relative transition cursor-pointer p-0.5">
                    <div id="lightningToggleThumb" class="w-4 h-4 rounded-full bg-amber-400 transition-transform transform translate-x-5 shadow-sm"></div>
                </button>
            </div>

            <!-- Secret Storm Destruction Button -->
            <div class="pt-2 border-t border-white/10">
                <button id="btnSecretChaos" class="w-full py-1.5 px-2 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-[11px] font-mono transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
                    <span id="chaosBtnText">Sakın Basmayın</span>
                </button>
            </div>

        </div>
    </div>

    <main id="mainContent" class="relative z-30 max-w-3xl mx-auto px-4 pt-20 sm:pt-16 opacity-0">

        <!-- Profile Section -->
        <section class="mb-8 sm:mb-10 text-center">
            <div class="relative inline-block mb-4">
                <img id="avatarImg" src="" alt="Profile Avatar" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full object-cover border-2 border-white/15 avatar-pulse mx-auto grayscale hover:grayscale-0 transition duration-500">
            </div>

            <h1 id="displayName" class="font-cinzel text-xl sm:text-3xl font-bold tracking-wider text-stone-200 mb-1"></h1>
            <p id="displayTitle" class="font-mono text-[11px] sm:text-sm text-stone-400 tracking-widest uppercase mb-3"></p>
            <p id="displayBio" class="text-stone-300 text-xs sm:text-base max-w-lg mx-auto leading-relaxed font-light px-2"></p>
        </section>

        <!-- Socials Section -->
        <section class="mb-8 sm:mb-10">
            <div id="socialsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </section>

        <!-- Specs Accordion Section -->
        <section class="mb-12">
            <div class="sh-card rounded-xl overflow-hidden border border-white/10">
                <!-- Mobil Çakışmayı Önleyen Esnek Başlık Yapısı -->
                <div class="p-3.5 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-left group">
                    <button id="btnToggleSpecs" class="flex items-center gap-3 flex-1 cursor-pointer text-left min-w-0 pr-2">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-black/20 border border-white/10 flex items-center justify-center text-stone-300 shrink-0">
                            <i class="fa-solid fa-microchip text-sm sm:text-base"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="text-xs sm:text-sm font-cinzel font-bold text-stone-200 tracking-wide uppercase truncate">
                                Sistem & Donanım Özellikleri
                            </div>
                            <div class="text-[11px] sm:text-xs font-mono text-stone-400 mt-0.5 truncate">İşlemci, Ekran Kartı, Ekipmanlar</div>
                        </div>
                    </button>
                    
                    <div class="flex items-center justify-end gap-2 sm:gap-3 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-white/5">
                        <button id="btnToggleAllSubcats" type="button" title="Tüm Donanım Kategorilerini Aç / Kapat" class="text-[11px] sm:text-xs font-mono px-2.5 sm:px-3 py-1.5 rounded-lg bg-black/20 hover:bg-black/40 border border-white/10 text-stone-300 transition cursor-pointer flex items-center gap-1.5">
                            <i class="fa-solid fa-layer-group text-[11px] text-stone-400"></i>
                            <span id="btnToggleAllText">Tümünü Aç</span>
                        </button>
                        <button id="btnSpecsChevronToggle" type="button" title="Sistem Menüsünü Aç / Kapat" class="p-1.5 rounded-lg hover:bg-black/20 text-stone-400 hover:text-stone-200 transition cursor-pointer">
                            <i id="specsChevron" class="fa-solid fa-chevron-down text-sm transition-transform duration-300"></i>
                        </button>
                    </div>
                </div>

                <div id="specsAccordion" class="specs-accordion px-3 sm:px-4 pb-3">
                    <div class="specs-accordion-inner">
                        <div id="specsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 items-start"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center py-6 border-t border-white/10 text-[11px] sm:text-xs text-stone-500 font-mono px-2">
            <p>bu site, helnyria tarafından vibekodlandı — dileyen herkes kodları özgürce kullanabilir.</p>
        </footer>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-black/90 backdrop-blur-md border border-white/15 text-stone-200 px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 text-xs pointer-events-none">
        <i class="fa-solid fa-circle-check text-stone-300 text-sm"></i>
        <span id="toastMsg">İşlem tamamlandı.</span>
    </div>

    <script>
        const FALLBACK_DATA = {
            profile: {
                name: "Helnyria",
                title: "// GÖZÜPEK YAZILIMCI & OYUN GELİŞTİRİCİ",

                    ]
                },
                {
                    id: "cat_storage",

                    icon: "fa-hard-drive",
                    items: [
                        { label: "Ana SSD (NVMe)", val: "Kingston Renegade 1TB (7300/6000 MB/s)" },
                        { label: "2. SSD (NVMe)", val: "INTENSO 500GB NVMe" },
                        { label: "Depolama HDD", val: "Seagate BarraCuda 2TB (ST2000DM008)" }
                    ]
                },
                {
                    id: "cat_peripherals",
                    title: "Klavye & Çevre Birimleri",
                    icon: "fa-keyboard",
                    items: [
                        { label: "Çalışma Masası", val: "Karr Office O-Flex Duo" },
                        { label: "Fare (Mouse)", val: "ATK Blazing Sky X1 Ultra White" },
                        { label: "Klavye", val: "Darmoshark TOP75" },
                        { label: "Mikrofon", val: "Lastvoice BM800BT" },
                        { label: "Oyuncu Koltuğu", val: "Hawk Fab v6 Stone" }
                    ]
                },
                {
                    id: "cat_controllers",
                    title: "Gamepad & Kontrolcüler",
                    icon: "fa-gamepad",
                    items: [
                        { label: "Ana Gamepad", val: "Flydigi Apex 4 Elite" },
                        { label: "İkincil Gamepad", val: "8BitDo Ultimate C" }
                    ]
                },
                {
                    id: "cat_audio",
                    title: "Ses & Kulaklıklar",
                    icon: "fa-headphones",
                    items: [
                        { label: "Ana Kulaklık", val: "Skullcandy Crusher Evo Black" },
                        { label: "Kablosuz Kulaklık", val: "Anker Soundcore Liberty 4 NC" }
                    ]
                },
                {
                    id: "cat_infrastructure",
                    title: "Güç & Ağ Altyapısı",
                    icon: "fa-plug",
                    items: [
                        { label: "Bluetooth Adaptör", val: "TP-Link UB500" },
                        { label: "Güç Kaynağı (UPS)", val: "Powerful SLE-1500 1500VA Line Interactive" },
                        { label: "Modem / Router", val: "Keenetic Hopper DSL (KN-3610)" }
                    ]
                }
            ],
            socials: [
                { id: "s1", platform: "Instagram", label: "@silent.rest", url: "https://instagram.com", icon: "fa-brands fa-instagram" },
                { id: "s2", platform: "Discord", label: "Helnyria", url: "copy:Helnyria", icon: "fa-brands fa-discord" },
                { id: "s3", platform: "Steam", label: "SilentRest", url: "https://store.steampowered.com", icon: "fa-brands fa-steam" },
                { id: "s4", platform: "RetroAchievements", label: "SilentGamer", url: "https://retroachievements.org", icon: "fa-solid fa-trophy" },
                { id: "s5", platform: "MyAnimeList", label: "MelancholicP", url: "https://myanimelist.net", icon: "<svg role=\"img\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\" class=\"w-5 h-5 fill-current\"><path d=\"M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm-.92 18.067h-2.56V6.933h2.56v11.134zm5.12 0h-2.56V5.933h2.56v12.134zm-7.68 0H6.933V9.333h2.587v8.734z\"/></svg>" },
                { id: "s6", platform: "Backloggd", label: "FoggyGames", url: "https://backloggd.com", icon: "fa-solid fa-gamepad" }
            ]
        };

        let appData = null;
        let isPlayingMusic = false;
        let lightningEnabled = true;
        let stormChaosActive = false;
        let stormChaosTimer = null;
        let allSubcatsOpen = false;
        let audioCtx = null;
        let rainGainNode = null;
        let rainSourceNode = null;
        let lightningTimer = null;
        let isUnlocked = false;

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Fetch failed");
                appData = await response.json();
            } catch (e) {
                appData = FALLBACK_DATA;
            }

            // Avatar bilgisini shukapi API'sinden ownerAvatarURL ile dinamik çekme
            try {
                const statsRes = await fetch('https://shukapi.vercel.app/api/stats');
                if (statsRes.ok) {
                    const statsData = await statsRes.json();
                    if (statsData && statsData.ownerAvatarURL) {
                        appData.profile.avatar = statsData.ownerAvatarURL;
                    }
                }
            } catch (err) {}

            renderUI();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function unlockAudio() {
            if (isUnlocked) return;
            isUnlocked = true;

            const overlay = document.getElementById('gunsEnterOverlay');
            if (overlay) {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                setTimeout(() => { overlay.style.display = 'none'; }, 700);
            }

            const btnToggleSettings = document.getElementById('btnToggleSettings');
            if (btnToggleSettings) {
                btnToggleSettings.classList.remove('opacity-0', 'pointer-events-none');
                btnToggleSettings.classList.add('opacity-100');
            }

            const mainContent = document.getElementById('mainContent');
            if (mainContent) {
                mainContent.classList.remove('opacity-0');
                mainContent.style.opacity = '1';
                mainContent.classList.add('melancholic-appear');
            }

            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}

            try { startProceduralRainAudio(); } catch(e) {}
            try { playMusic(); } catch(e) {}
            try { scheduleNextLightning(); } catch(e) {}
        }

        function playMusic() {
            const bgMusic = document.getElementById('bgMusic');
            if (!bgMusic || !appData) return;

            if (appData.profile.audioPath) {
                bgMusic.src = appData.profile.audioPath;
            }

            const musicVol = parseFloat(document.getElementById('musicVolumeSlider')?.value || 0.6);
            bgMusic.volume = musicVol;

            bgMusic.play().then(() => {
                isPlayingMusic = true;
                updatePlayButtonUI();
            }).catch(err => {
                isPlayingMusic = false;
                updatePlayButtonUI();
            });
        }

        function toggleMusic() {
            const bgMusic = document.getElementById('bgMusic');
            if (!bgMusic || !appData) return;

            if (isPlayingMusic) {
                bgMusic.pause();
                isPlayingMusic = false;
            } else {
                if (!bgMusic.src || bgMusic.src === '' || bgMusic.src.endsWith('#')) {
                    if (appData.profile.audioPath) bgMusic.src = appData.profile.audioPath;
                }
                bgMusic.play().then(() => {
                    isPlayingMusic = true;
                    updatePlayButtonUI();
                }).catch(e => {});
            }
            updatePlayButtonUI();
        }

        function updatePlayButtonUI() {
            const icon = document.getElementById('playIconModal');
            const status = document.getElementById('musicStatus');
            if (icon) icon.className = isPlayingMusic ? "fa-solid fa-pause text-[10px]" : "fa-solid fa-play text-[10px]";
            if (status) status.className = isPlayingMusic ? "inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0" : "inline-block w-2 h-2 rounded-full bg-stone-600 shrink-0";
        }

        function startProceduralRainAudio() {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = output[i];
                    output[i] *= 3.5;
                }

                rainSourceNode = audioCtx.createBufferSource();
                rainSourceNode.buffer = noiseBuffer;
                rainSourceNode.loop = true;

                const rainFilter = audioCtx.createBiquadFilter();
                rainFilter.type = 'lowpass';
                rainFilter.frequency.value = 1000;

                rainGainNode = audioCtx.createGain();
                const initialVol = parseFloat(document.getElementById('rainVolumeSlider')?.value || 0.4);
                rainGainNode.gain.setValueAtTime(initialVol === 0 ? 0.00001 : initialVol, audioCtx.currentTime);

                rainSourceNode.connect(rainFilter);
                rainFilter.connect(rainGainNode);
                rainGainNode.connect(audioCtx.destination);

                rainSourceNode.start();
            } catch(e) {}
        }

        function playRealisticThunder() {
            if (!lightningEnabled && !stormChaosActive) return;
            if (!audioCtx || audioCtx.state !== 'running') return;
            const rainVol = parseFloat(document.getElementById('rainVolumeSlider')?.value || 0.4);
            if (rainVol <= 0.0001 && !stormChaosActive) return;

            try {
                const now = audioCtx.currentTime;
                const musicVol = parseFloat(document.getElementById('musicVolumeSlider')?.value || 0.6);
                const baseMasterVol = Math.min(1.0, Math.max(0.5, (rainVol + musicVol) * 0.85));

                const rumbleDuration = stormChaosActive ? 3.0 : 5.5;
                const rumbleBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * rumbleDuration, audioCtx.sampleRate);
                const rumbleData = rumbleBuffer.getChannelData(0);
                let lastOut = 0.0;
                for (let i = 0; i < rumbleBuffer.length; i++) {
                    const white = Math.random() * 2 - 1;
                    rumbleData[i] = (lastOut + (0.025 * white)) / 1.025;
                    lastOut = rumbleData[i];
                    rumbleData[i] *= 5.0;
                }
                const rumbleSource = audioCtx.createBufferSource();
                rumbleSource.buffer = rumbleBuffer;

                const rumbleFilter = audioCtx.createBiquadFilter();
                rumbleFilter.type = 'lowpass';
                rumbleFilter.frequency.setValueAtTime(stormChaosActive ? 600 : 400, now);
                rumbleFilter.frequency.exponentialRampToValueAtTime(30, now + rumbleDuration);

                const rumbleGain = audioCtx.createGain();
                rumbleGain.gain.setValueAtTime(0, now);
                rumbleGain.gain.linearRampToValueAtTime(baseMasterVol * 1.5, now + 0.05);
                rumbleGain.gain.exponentialRampToValueAtTime(baseMasterVol * 0.5, now + 0.8);
                rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + rumbleDuration);

                rumbleSource.connect(rumbleFilter);
                rumbleFilter.connect(rumbleGain);
                rumbleGain.connect(audioCtx.destination);
                rumbleSource.start(now);
            } catch(e) {}
        }

        function triggerLightning() {
            if (!lightningEnabled && !stormChaosActive) return;
            const overlay = document.getElementById('lightningOverlay');
            if (!overlay) return;

            const intenseOpacity = stormChaosActive ? (Math.random() * 0.2 + 0.9) : (Math.random() * 0.3 + 0.7);
            overlay.style.backgroundColor = `rgba(255, 255, 255, ${intenseOpacity})`;
            
            setTimeout(() => {
                overlay.style.backgroundColor = 'rgba(240, 246, 255, 0.15)';
                setTimeout(() => {
                    overlay.style.backgroundColor = `rgba(255, 255, 255, ${intenseOpacity * 0.9})`;
                    setTimeout(() => {
                        overlay.style.backgroundColor = 'rgba(240, 246, 255, 0.05)';
                        setTimeout(() => { overlay.style.backgroundColor = 'transparent'; }, 50);
                    }, 25);
                }, 20);
            }, 30);

            setTimeout(playRealisticThunder, Math.random() * 150 + 40);
            
            if (stormChaosActive) {
                scheduleStormChaosLightning();
            } else {
                scheduleNextLightning();
            }
        }

        function scheduleNextLightning() {
            clearTimeout(lightningTimer);
            if (!lightningEnabled || stormChaosActive) return;
            lightningTimer = setTimeout(triggerLightning, Math.random() * 12000 + 6000);
        }

        function scheduleStormChaosLightning() {
            clearTimeout(lightningTimer);
            clearTimeout(stormChaosTimer);
            if (!stormChaosActive) return;
            stormChaosTimer = setTimeout(triggerLightning, Math.random() * 450 + 120);
        }

        function initRainCanvas() {
            const canvas = document.getElementById('rainCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function updateCanvasSize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                }
            }

            updateCanvasSize();
            window.addEventListener('resize', updateCanvasSize);

            const drops = [];
            for (let i = 0; i < 200; i++) {
                drops.push({
                    x: Math.random() * (window.innerWidth + 400) - 100,
                    y: Math.random() * window.innerHeight,
                    length: Math.random() * 20 + 10,
                    speed: Math.random() * 12 + 8,
                    opacity: Math.random() * 0.4 + 0.1
                });
            }

            const ripples = [];

            function animateRain() {
                updateCanvasSize();
                const width = canvas.width;
                const height = canvas.height;

                ctx.clearRect(0, 0, width, height);
                ctx.strokeStyle = stormChaosActive ? 'rgba(255, 230, 100, 0.7)' : 'rgba(180, 200, 220, 0.35)';
                ctx.lineWidth = stormChaosActive ? 2 : 1;
                ctx.beginPath();
                
                const speedMultiplier = stormChaosActive ? 4.0 : 1.0;
                for (let i = 0; i < drops.length; i++) {
                    const d = drops[i];
                    ctx.moveTo(d.x, d.y);
                    ctx.lineTo(d.x - (d.length * 0.25 * speedMultiplier), d.y + (d.length * speedMultiplier));
                    d.y += d.speed * speedMultiplier;
                    d.x -= d.speed * 0.25 * speedMultiplier;

                    if (d.y > height || d.x < -150) {
                        if (Math.random() > 0.4) {
                            ripples.push({
                                x: d.x,
                                y: height - Math.random() * 30,
                                radius: 1,
                                maxRadius: Math.random() * 18 + 8,
                                opacity: 0.8
                            });
                        }
                        d.y = -20;
                        d.x = Math.random() * (width + 400) - 100;
                    }
                }
                ctx.stroke();

                for (let i = ripples.length - 1; i >= 0; i--) {
                    const r = ripples[i];
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = stormChaosActive ? `rgba(255, 220, 50, ${r.opacity})` : `rgba(160, 180, 200, ${r.opacity})`;
                    ctx.lineWidth = stormChaosActive ? 1.5 : 0.8;
                    ctx.stroke();

                    r.radius += stormChaosActive ? 1.2 : 0.6;
                    r.opacity -= stormChaosActive ? 0.04 : 0.02;

                    if (r.opacity <= 0 || r.radius >= r.maxRadius) ripples.splice(i, 1);
                }
                requestAnimationFrame(animateRain);
            }
            animateRain();
        }

        function renderUI() {
            if (!appData) return;
            document.getElementById('displayName').innerText = appData.profile.name || "";
            document.getElementById('displayTitle').innerText = appData.profile.title || "";
            document.getElementById('displayBio').innerText = appData.profile.bio || "";
            if (appData.profile.avatar) document.getElementById('avatarImg').src = appData.profile.avatar;

            renderSpecs();
            renderSocials();
        }

        function renderSpecs() {
            const container = document.getElementById('specsContainer');
            if (!container || !appData) return;
            container.innerHTML = '';

            appData.specsCategories.forEach((cat, catIdx) => {
                const categoryWrapper = document.createElement('div');
                categoryWrapper.className = "specs-cat-card p-3.5 rounded-xl bg-black/10 backdrop-blur-[2px] border border-white/5 shadow-md";

                categoryWrapper.innerHTML = `
                    <button type="button" class="btn-toggle-subcat w-full flex items-center justify-between text-left group cursor-pointer" data-cat="${catIdx}">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-md bg-black/20 border border-white/10 flex items-center justify-center text-stone-300 text-sm shrink-0 transition">
                                <i class="fa-solid ${cat.icon || 'fa-folder'}"></i>
                            </div>
                            <div>
                                <span class="text-sm font-cinzel font-bold text-stone-300 transition">${cat.title}</span>
                            </div>
                        </div>
                        <i class="subcat-chevron fa-solid fa-chevron-down text-xs text-stone-500 transition-transform duration-300"></i>
                    </button>
                    <div class="subcat-content specs-accordion mt-2.5">
                        <div class="specs-accordion-inner flex flex-col gap-2 pt-2.5 border-t border-white/5">
                            ${cat.items.map(item => `
                                <div class="spec-item-card p-2.5 rounded-lg bg-black/10 border border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 transition-all cursor-pointer group/item" 
                                     data-copy-val="${item.val}" 
                                     title="Panoya kopyalamak için tıklayın">
                                    <div class="flex items-center gap-2 shrink-0">
                                        <span class="w-1.5 h-1.5 rounded-full bg-stone-600"></span>
                                        <span class="text-xs font-mono text-stone-400 font-medium">${item.label}</span>
                                    </div>
                                    <div class="flex items-center gap-2 min-w-0 justify-between sm:justify-end">
                                        <span class="text-xs font-mono text-stone-200 font-medium text-left sm:text-right break-words select-all">${item.val}</span>
                                        <i class="fa-regular fa-copy text-[10px] text-stone-500 shrink-0 ml-1" title="Kopyala"></i>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(categoryWrapper);
            });

            container.querySelectorAll('.btn-toggle-subcat').forEach(btn => {
                btn.addEventListener('click', () => {
                    const wrapper = btn.closest('.specs-cat-card');
                    if (!wrapper) return;
                    wrapper.querySelector('.subcat-content')?.classList.toggle('open');
                    wrapper.querySelector('.subcat-chevron')?.classList.toggle('rotate-180');
                });
            });

            container.querySelectorAll('.spec-item-card').forEach(card => {
                card.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const copyText = card.dataset.copyVal;
                    if (!copyText) return;

                    try {
                        await navigator.clipboard.writeText(copyText);
                        showToast(`Panoya kopyalandı: ${copyText}`);
                    } catch (err) {
                        const dummy = document.createElement('textarea');
                        dummy.value = copyText;
                        document.body.appendChild(dummy);
                        dummy.select();
                        document.execCommand('copy');
                        document.body.removeChild(dummy);
                        showToast(`Panoya kopyalandı: ${copyText}`);
                    }
                });
            });
        }

        function renderSocials() {
            const container = document.getElementById('socialsContainer');
            if (!container || !appData) return;
            container.innerHTML = '';

            appData.socials.forEach(s => {
                const btn = document.createElement('div');
                btn.className = "sh-card p-4 rounded-xl flex items-center justify-between group cursor-pointer transition-all duration-300";

                const iconHtml = s.icon.startsWith('<svg') 
                    ? s.icon 
                    : `<i class="${s.icon} text-lg"></i>`;

                btn.innerHTML = `
                    <div class="flex items-center gap-3.5">
                        <div class="w-10 h-10 rounded-lg bg-black/20 border border-white/10 flex items-center justify-center text-stone-300 transition-all">
                            ${iconHtml}
                        </div>
                        <div>
                            <div class="text-sm font-cinzel font-bold text-stone-200 transition">${s.platform}</div>
                            <div class="text-xs font-mono text-stone-400 mt-0.5">${s.label}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-stone-500 transition-colors"></i>
                `;

                btn.addEventListener('click', async () => {
                    if (s.url && s.url.startsWith('copy:')) {
                        const copyVal = s.url.replace('copy:', '');
                        try {
                            await navigator.clipboard.writeText(copyVal);
                            showToast(`${s.platform} adresi kopyalandı! (${copyVal})`);
                        } catch (err) {
                            const dummy = document.createElement('textarea');
                            dummy.value = copyVal;
                            document.body.appendChild(dummy);
                            dummy.select();
                            document.execCommand('copy');
                            document.body.removeChild(dummy);
                            showToast(`${s.platform} adresi kopyalandı! (${copyVal})`);
                        }
                    } else if (s.url) {
                        window.open(s.url, '_blank');
                    }
                });
                container.appendChild(btn);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initRainCanvas();
            loadData();

            // Portal Giriş Tıklama Dinleyicileri
            const enterBtn = document.getElementById('enterPortalBtn');
            enterBtn?.addEventListener('click', unlockAudio);
            const overlay = document.getElementById('gunsEnterOverlay');
            overlay?.addEventListener('click', unlockAudio);

            const settingsDropdown = document.getElementById('settingsDropdown');
            const btnToggleSettings = document.getElementById('btnToggleSettings');

            btnToggleSettings?.addEventListener('click', (e) => {
                e.stopPropagation();
                settingsDropdown?.classList.toggle('hidden-panel');
            });

            document.addEventListener('click', (e) => {
                if (settingsDropdown && !settingsDropdown.contains(e.target) && !btnToggleSettings.contains(e.target)) {
                    settingsDropdown.classList.add('hidden-panel');
                }
            });

            document.getElementById('btnPlayPauseModal')?.addEventListener('click', toggleMusic);
            
            const rainSlider = document.getElementById('rainVolumeSlider');
            const rainValText = document.getElementById('rainValText');
            rainSlider?.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if (rainValText) rainValText.innerText = Math.round(val * 100) + '%';
                if (rainGainNode && audioCtx) {
                    const targetVal = val === 0 ? 0.0 : val;
                    rainGainNode.gain.setValueAtTime(targetVal, audioCtx.currentTime);
                }
            });

            const musicSlider = document.getElementById('musicVolumeSlider');
            const musicValText = document.getElementById('musicValText');
            musicSlider?.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if (musicValText) musicValText.innerText = Math.round(val * 100) + '%';
                const bgMusic = document.getElementById('bgMusic');
                if (bgMusic) bgMusic.volume = val;
            });

            const btnToggleLightning = document.getElementById('btnToggleLightning');
            const thumb = document.getElementById('lightningToggleThumb');
            btnToggleLightning?.addEventListener('click', () => {
                lightningEnabled = !lightningEnabled;
                if (lightningEnabled) {
                    btnToggleLightning.classList.remove('bg-stone-800/40', 'border-white/10');
                    btnToggleLightning.classList.add('bg-amber-500/20', 'border-amber-500/40');
                    thumb?.classList.remove('translate-x-0', 'bg-stone-500');
                    thumb?.classList.add('translate-x-5', 'bg-amber-400');
                    scheduleNextLightning();
                    showToast("Şimşek efekti açıldı.");
                } else {
                    btnToggleLightning.classList.remove('bg-amber-500/20', 'border-amber-500/40');
                    btnToggleLightning.classList.add('bg-stone-800/40', 'border-white/10');
                    thumb?.classList.remove('translate-x-5', 'bg-amber-400');
                    thumb?.classList.add('translate-x-0', 'bg-stone-500');
                    clearTimeout(lightningTimer);
                    showToast("Şimşek efekti kapatıldı.");
                }
            });

            const btnSecretChaos = document.getElementById('btnSecretChaos');
            const chaosBtnText = document.getElementById('chaosBtnText');
            btnSecretChaos?.addEventListener('click', () => {
                stormChaosActive = !stormChaosActive;
                if (stormChaosActive) {
                    btnSecretChaos.classList.remove('bg-amber-500/10', 'border-amber-500/30', 'text-amber-300');
                    btnSecretChaos.classList.add('bg-amber-500', 'border-amber-400', 'text-black', 'font-bold');
                    if (chaosBtnText) chaosBtnText.innerText = "Fırtınayı Durdur!";
                    document.documentElement.classList.add('storm-panic-border');
                    showToast("💥 KRİTİK HATA: Yıldırım Fırtınası Başlatıldı!");
                    triggerLightning();
                } else {
                    btnSecretChaos.classList.remove('bg-amber-500', 'border-amber-400', 'text-black', 'font-bold');
                    btnSecretChaos.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-300');
                    if (chaosBtnText) chaosBtnText.innerText = "Sakın Basmayın";
                    document.documentElement.classList.remove('storm-panic-border');
                    clearTimeout(stormChaosTimer);
                    showToast("Sistem fırtınadan kurtarıldı.");
                    if (lightningEnabled) scheduleNextLightning();
                }
            });

            const toggleMainSpecsAccordion = () => {
                const accordion = document.getElementById('specsAccordion');
                const chevron = document.getElementById('specsChevron');
                if (accordion) accordion.classList.toggle('open');
                if (chevron) chevron.classList.toggle('rotate-180');
            };

            document.getElementById('btnToggleSpecs')?.addEventListener('click', toggleMainSpecsAccordion);
            document.getElementById('btnSpecsChevronToggle')?.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMainSpecsAccordion();
            });

            document.getElementById('btnToggleAllSubcats')?.addEventListener('click', (e) => {
                e.stopPropagation();
                const accordion = document.getElementById('specsAccordion');
                const mainChevron = document.getElementById('specsChevron');
                
                if (accordion && !accordion.classList.contains('open')) {
                    accordion.classList.add('open');
                    if (mainChevron) mainChevron.classList.add('rotate-180');
                }

                const container = document.getElementById('specsContainer');
                if (!container) return;

                const contents = container.querySelectorAll('.subcat-content');
                const chevrons = container.querySelectorAll('.subcat-chevron');
                const btnText = document.getElementById('btnToggleAllText');

                allSubcatsOpen = !allSubcatsOpen;

                contents.forEach(c => {
                    if (allSubcatsOpen) c.classList.add('open');
                    else c.classList.remove('open');
                });

                chevrons.forEach(ch => {
                    if (allSubcatsOpen) ch.classList.add('rotate-180');
                    else ch.classList.remove('rotate-180');
                });

                if (btnText) btnText.innerText = allSubcatsOpen ? "Tümünü Kapat" : "Tümünü Aç";
            });
        });
    </script>
</body>
